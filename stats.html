<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flock Hammer — Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e15; --glass: rgba(15,20,30,.72); --glass-line: rgba(255,255,255,.08);
    --ink: #f2f5f9; --muted: #7d8899; --ice: #8fd3ff; --signal: #ff5a36; --signal-soft: rgba(255,90,54,.22);
    --ok: #4ade80; --radius: 18px; --shadow: 0 20px 50px -20px rgba(0,0,0,.8), 0 0 0 1px var(--glass-line);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { background-image: radial-gradient(60% 40% at 80% -10%, rgba(143,211,255,.10), transparent 60%),
                           radial-gradient(50% 40% at 0% 100%, rgba(255,90,54,.10), transparent 60%); min-height: 100vh; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 60px; }
  nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  nav .brand { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  nav a { color: var(--ice); font-weight: 700; font-size: 13px; text-decoration: none; padding: 8px 14px; border-radius: 999px; background: var(--glass); box-shadow: var(--shadow); }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
  .card { grid-column: span 12; background: var(--glass); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 24px; }
  .card h2 { margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .kpi { grid-column: span 3; }
  .kpi .big { font-size: 40px; font-weight: 800; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .kpi .delta { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .kpi .delta b { color: var(--ok); font-weight: 600; }
  .half { grid-column: span 6; }
  .bars { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center; font-size: 14px; }
  .bars .name { color: var(--ink); white-space: nowrap; }
  .bars .track { height: 8px; border-radius: 999px; background: rgba(255,255,255,.06); overflow: hidden; }
  .bars .fill { height: 100%; border-radius: 999px; background: var(--signal); }
  .bars .fill.alt { background: var(--ice); }
  .bars .n { color: var(--muted); font-size: 12px; text-align: right; }
  .seg { display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 2px; margin-bottom: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 18px; font-size: 13px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; background: var(--c); }
  svg.chart { width: 100%; height: 220px; display: block; overflow: visible; }
  .empty { color: var(--muted); font-size: 14px; }
  .recent { display: grid; gap: 6px; }
  .recent a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.04); color: var(--ink); text-decoration: none; font-size: 14px; }
  .recent a:hover { background: rgba(255,255,255,.08); }
  .recent .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .footer { margin-top: 20px; font-size: 12px; color: var(--muted); }
  .footer a { color: var(--muted); }
  @media (max-width: 760px) { .kpi { grid-column: span 6; } .half { grid-column: span 12; } .kpi .big { font-size: 32px; } }
</style>
</head>
<body>
<main>
  <nav><span class="brand">Flock Hammer · Stats</span><a href="index.html">Open the map</a></nav>

  <div class="grid">
    <section class="card kpi"><h2>Cameras mapped</h2><div class="big mono" id="kTotal">—</div><div class="delta" id="dTotal"></div></section>
    <section class="card kpi"><h2>Flock Safety</h2><div class="big mono" id="kFlock">—</div><div class="delta" id="dFlock"></div></section>
    <section class="card kpi"><h2>With view angle</h2><div class="big mono" id="kDir">—</div><div class="delta" id="dDir"></div></section>
    <section class="card kpi"><h2>States covered</h2><div class="big mono" id="kStates">—</div><div class="delta" id="dStates"></div></section>

    <section class="card"><h2>Growth</h2><div id="growth"></div></section>

    <section class="card"><h2>Recently added</h2><div id="recent"></div></section>

    <section class="card half"><h2>Cameras by state</h2><div id="states"></div></section>
    <section class="card half">
      <h2>Vendors</h2><div id="vendors"></div>
      <h2 style="margin-top:26px">Top operators</h2><div id="operators"></div>
    </section>
  </div>
  <p class="footer" id="foot">Data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors.</p>
</main>

<script>
(async () => {
  const $ = id => document.getElementById(id);
  const fmt = n => n.toLocaleString();
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const PALETTE = ['#ff5a36', '#8fd3ff', '#c4b5fd', '#4ade80', '#fbbf24', '#7d8899'];

  let d, history = [];
  try { d = await (await fetch('data/cameras.json?t=' + Date.now())).json(); }
  catch { $('growth').innerHTML = '<p class="empty">No data yet. Run the nightly export once (Actions tab → Nightly camera export) and this page fills in.</p>'; return; }
  try { history = await (await fetch('data/history.json?t=' + Date.now())).json(); } catch {}

  const S = d.strings;
  const cams = d.cameras.map(([id, lat, lon, tsDays, st, kv]) => {
    const tags = {}; for (let i = 0; i < kv.length; i += 2) tags[S[kv[i]]] = S[kv[i + 1]];
    return { id, tags, state: st >= 0 ? S[st] : null, flock: /flock/i.test(tags.manufacturer || '') };
  });
  const total = cams.length;
  const flock = cams.filter(c => c.flock).length;
  const withDir = cams.filter(c => c.tags.direction || c.tags['camera:direction']).length;
  const byState = count(cams.map(c => c.state).filter(Boolean));

  // ---- KPIs ----
  $('kTotal').textContent = fmt(total);
  $('kFlock').textContent = fmt(flock);
  $('kDir').textContent = fmt(withDir);
  $('dDir').textContent = `${Math.round(100 * withDir / total)}% of cameras`;
  $('kStates').textContent = fmt(Object.keys(byState).length);
  $('dStates').textContent = byState[0] ? '' : (cams.some(c => c.state) ? '' : 'State tagging runs in the nightly export');

  const ago = d => history.find(h => (Date.now() - new Date(h.date)) / 864e5 >= d);
  const delta = (key, el) => {
    const w = ago(7), m = ago(30), now = history.at(-1);
    if (!now || (!w && !m)) { $(el).textContent = history.length ? 'Tracking growth from today' : ''; return; }
    const parts = [];
    if (w) parts.push(`<b>+${fmt(now[key] - w[key])}</b> this week`);
    if (m) parts.push(`<b>+${fmt(now[key] - m[key])}</b> this month`);
    $(el).innerHTML = parts.join(' · ');
  };
  delta('total', 'dTotal'); delta('flock', 'dFlock');

  // ---- Growth chart ----
  if (history.length < 2) {
    $('growth').innerHTML = `<p class="empty">The growth line appears once the export has run on at least two days. ${history.length ? 'First snapshot recorded.' : ''}</p>`;
  } else $('growth').innerHTML = lineChart(history);

  // ---- States ----
  const stateRows = Object.entries(byState).sort((a, b) => b[1] - a[1]).slice(0, 15);
  $('states').innerHTML = stateRows.length ? bars(stateRows) : '<p class="empty">State data appears after the next nightly export.</p>';

  // ---- Vendors ----
  const vendor = c => {
    const m = (c.tags.manufacturer || '').toLowerCase();
    if (!m) return 'Untagged';
    if (m.includes('flock')) return 'Flock Safety';
    if (m.includes('motorola') || m.includes('vigilant')) return 'Motorola / Vigilant';
    if (m.includes('genetec')) return 'Genetec';
    if (m.includes('rekor')) return 'Rekor';
    if (m.includes('axon')) return 'Axon';
    return 'Other';
  };
  const byVendor = Object.entries(count(cams.map(vendor))).sort((a, b) => b[1] - a[1]);
  $('vendors').innerHTML = `<div class="seg">${byVendor.map(([k, v], i) => `<div title="${esc(k)}: ${v}" style="flex:${v};background:${PALETTE[i % PALETTE.length]}"></div>`).join('')}</div>
    <div class="legend">${byVendor.map(([k, v], i) => `<span style="--c:${PALETTE[i % PALETTE.length]}">${esc(k)} <span class="mono" style="color:var(--ink)">${fmt(v)}</span></span>`).join('')}</div>`;

  // ---- Operators ----
  const opRows = Object.entries(count(cams.map(c => c.tags.operator).filter(Boolean))).sort((a, b) => b[1] - a[1]).slice(0, 10);
  $('operators').innerHTML = opRows.length ? bars(opRows, 'alt') : '<p class="empty">Few cameras have an operator tag yet.</p>';

  // ---- Recently added ----
  try {
    const recent = await (await fetch('data/new.json?t=' + Date.now())).json();
    $('recent').innerHTML = recent.length ? `<div class="recent">${recent.slice(0, 20).map(r =>
      `<a href="index.html#map=17/${r.lat.toFixed(5)}/${r.lon.toFixed(5)}&cam=${r.id}"><span>${esc(r.manufacturer || 'ALPR')} camera${r.state ? ' · ' + esc(r.state) : ''}${r.operator ? ' · ' + esc(r.operator) : ''}</span><span class="when mono">${new Date(r.seen).toLocaleDateString()}</span></a>`).join('')}</div>
      <p class="footer">Subscribe: <a href="data/feed.xml">RSS feed</a> of new cameras.</p>`
      : '<p class="empty">Appears after the second nightly export, once there is a previous snapshot to compare against.</p>';
  } catch { $('recent').innerHTML = '<p class="empty">Appears after the second nightly export.</p>'; }

  $('foot').innerHTML += ` Snapshot ${new Date(d.generated).toLocaleString()}.`;

  // ---- helpers ----
  function count(arr) { return arr.reduce((m, k) => (m[k] = (m[k] || 0) + 1, m), {}); }
  function bars(rows, cls = '') {
    const max = rows[0][1];
    return `<div class="bars">${rows.map(([k, v]) =>
      `<span class="name">${esc(k)}</span><div class="track"><div class="fill ${cls}" style="width:${100 * v / max}%"></div></div><span class="n mono">${fmt(v)}</span>`).join('')}</div>`;
  }
  function lineChart(h) {
    const W = 1000, H = 220, pl = 48, pr = 12, pt = 12, pb = 28;
    const xs = h.map(d => new Date(d.date).getTime());
    const x0 = xs[0], x1 = xs.at(-1) || x0 + 1;
    const ymax = Math.max(...h.map(d => d.total)) * 1.05, ymin = Math.min(...h.map(d => d.flock)) * .95;
    const X = t => pl + (t - x0) / (x1 - x0 || 1) * (W - pl - pr);
    const Y = v => pt + (1 - (v - ymin) / (ymax - ymin || 1)) * (H - pt - pb);
    const path = key => h.map((d, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)},${Y(d[key]).toFixed(1)}`).join(' ');
    const ticks = [0, .5, 1].map(f => ymin + f * (ymax - ymin));
    const dateLbl = t => new Date(t).toLocaleDateString([], { month: 'short', day: 'numeric' });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.07)"/>
        <text x="${pl - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="#7d8899" font-family="JetBrains Mono, monospace">${Math.round(v).toLocaleString()}</text>`).join('')}
      <path d="${path('total')}" fill="none" stroke="#8fd3ff" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
      <path d="${path('flock')}" fill="none" stroke="#ff5a36" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
      <text x="${pl}" y="${H - 8}" font-size="11" fill="#7d8899" font-family="JetBrains Mono, monospace">${dateLbl(x0)}</text>
      <text x="${W - pr}" y="${H - 8}" text-anchor="end" font-size="11" fill="#7d8899" font-family="JetBrains Mono, monospace">${dateLbl(x1)}</text>
    </svg>
    <div class="legend" style="margin-top:10px"><span style="--c:#8fd3ff">All ALPR</span><span style="--c:#ff5a36">Flock Safety</span></div>`;
  }
})();
</script>
</body>
</html>
